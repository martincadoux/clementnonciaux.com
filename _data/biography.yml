# ENGLISH
- tag: en
  language: English
  abbreviation: EN
  content: |-
    > Clément Nonciaux has an innate talent for seamlessly blending reason and emotion. It is his trademark.
    >
    > -- <cite>ClassicalMusicNews.ru</cite>

    Winner of the inaugural International Rachmaninoff Competition for Pianists, Conductors and Composers in Moscow, French conductor Clément Nonciaux has rapidly established himself as a distinctive presence on the international musical scene.

    His career has taken him to some of Russia’s most prestigious orchestras and concert halls. In Moscow, he is regularly invited to conduct the Russian National Orchestra, the Svetlanov Symphony Orchestra, the Moscow Philharmonic Orchestra and the Tchaikovsky Symphony Orchestra. His collaborations also include performances with soprano Aida Garifullina and violinist Vadim Repin, notably in connection with his festival. His engagements have brought him to many regions of Russia, from Tatarstan and Kazan to Siberia and Novosibirsk, as well as the Urals and Perm.

    Alongside his Russian career, Clément Nonciaux maintains a strong presence on the European scene. In France, he has collaborated with the Orchestre de la Région Centre-Val de Loire and the Orchestre de Picardie. In Germany, he has worked as assistant conductor to distinguished conductors including Steven Sloane and Karl-Heinz Steffens.

    A passionate advocate of the French repertoire, Clément Nonciaux is committed to bringing its richness and diversity to audiences worldwide. His repertoire encompasses major symphonic and operatic works, as well as some of the great choral masterpieces of the Western tradition, including Britten’s War Requiem, Verdi’s Requiem and Orff’s Carmina Burana. He is also regularly invited to work with the Young Artists Program of the Bolshoi Theatre in Moscow, where he shares his experience and expertise as a guest conductor and teacher.

    For Clément Nonciaux, conducting is above all an art of connection: between musicians, cultures and audiences. Fluent in five languages, he draws deeply on his experience of different cultural environments, seeking to create a genuine and immediate dialogue with audiences wherever he performs. Emotion and authenticity lie at the heart of his artistic approach. His expressive and theatrical conducting style combines a strong physical presence with a profound attention to musical detail, bringing vitality, depth and sincerity to every performance.

    Born in Tours, France, Clément Nonciaux holds a Master’s degree in Orchestral Conducting from the Berlin University of the Arts, where he studied with Steven Sloane and Harry Curtis, and a Bachelor’s degree from the Musikhochschule Freiburg im Breisgau, where he studied with Scott Sandmeier.

# FRENCH
- tag: fr
  language: Français
  abbreviation: FR
  content: |-
    > « Clément Nonciaux a un talent inné pour marier harmonieusement raison et émotion. C’est sa marque de fabrique. »
    >
    > -- <cite>ClassicalMusicNews.ru</cite>

    Lauréat du premier Concours international Rachmaninov pour pianistes, chefs d’orchestre et compositeurs à Moscou, le chef d'orchestre français Clément Nonciaux s'est rapidement imposé sur la scène internationale.

    Il se produit régulièrement avec les plus grands orchestres russes. À Moscou, il est fréquemment invité à diriger l’Orchestre National de Russie, le Svetlanov Symphony Orchestra, l’Orchestre philharmonique de Moscou ainsi que le Tchaikovsky Symphony Orchestra dans les salles les plus prestigieuses de la capitale. 
    Il accompagne la soprano Aida Garifullina en tournée et collabore avec le violoniste Vadim Repin dans le cadre de son festival. Ses engagements l'ont conduit à travers toute la Russie, notamment au Tatarstan (Kazan), en Sibérie (Novossibirsk) et dans l’Oural (Perm).
    
    Clément Nonciaux poursuit également une carrière active en Europe. En France, il collabore avec l'Orchestre de la Région Centre-Val de Loire et l'Orchestre de Picardie. En Allemagne, il a été assistant de chefs renommés tels que Steven Sloane et Karl-Heinz Steffens.

    Très engagé dans la diffusion du répertoire français, il en a déjà dirigé les plus grandes œuvres symphoniques et lyriques. Son répertoire comporte également des chefs-d'œuvre choraux tels que le War Requiem de Britten, le Requiem de Verdi ainsi que Carmina Burana d'Orff. Par ailleurs, il intervient régulièrement comme professeur invité auprès de l’Opéra Studio du Théâtre Bolchoï.

    Clément Nonciaux se consacre à la musique avec pour objectif de créer des liens à travers le monde. Parlant couramment cinq langues, il s’investit passionnément dans l’exploration des cultures étrangères afin d’établir une connexion plus étroite avec son public.  
    Émotion et authenticité sont ses maîtres-mots : sa gestique expressive et théâtrale donne à entendre vie, relief et sincérité sur scène.

    Né à Tours en France, Clément Nonciaux est diplômé d'un Master de direction d'orchestre à l'Université des Arts de Berlin (Steven Sloane, Harry Curtis) et d'un Bachelor à la Musikhochschule de Freiburg-en-Brisgau (Scott Sandmeier).
    
    > « Tours et sa Loire, Freiburg et sa Forêt Noire, les grandes capitales, Berlin puis Moscou… Tantôt zéphyr, tantôt cyclone, j’attends impatiemment de voir où me portera prochainement ce vent d’Ouest et espère vous emporter avec moi lors d’une future rencontre! »

# RUSSIAN
- tag: ru
  language: Русский
  abbreviation: РУ
  content: |-
    > Дирижер Нонсьё вообще умеет органично сочетать разум и чувства. Собственно говоря, это его отличительная манера
    >
    > -- <cite>ClassicalMusicNews.ru</cite>

    Клеман Нонсьё родился в Туре (Франция). Получил образование пианиста и музыковеда в Консерватории имени Франсиса Пуленка в родном городе. Также занимался в классах клавесина и ударных инструментов.

    Оркестровому дирижированию обучался во Высшей школе музыки Фрайбурга и Берлинском университете искусств у Стивена Слоуна и Гарри Кёртиса. Во время учебы в Германии дирижировал оркестром Берлинской комише оперы, Берлинским симфоническим оркестром, Бохумским симфоническим оркестром, оркестром Kammerakademie Potsdam и другими коллективами. В качестве репетитора сотрудничал с оперными театрами Фрайбурга, Тура и Сантьяго (Чили). Работал ассистентом дирижера Стивена Слоуна с различными оркестрами в Германии.

    В 2022 году Клеман Нонсьё был удостоен II премии I Международного конкурса пианистов, композиторов и дирижеров имени С. В. Рахманинова в Москве, после чего получил приглашение выступить с Симфоническим оркестром Мариинского театра в Санкт-Петербурге.

    В 2024 году в Московском театре «Новая опера» имени Е. В. Колобова состоялась премьера сценической постановки оперы «Почтальон из Лонжюмо» Адольфа Адана под управлением Клемана Нонсьё (режиссер — Евгений Писарев).

    Клеман Нонсьё регулярно выступает на крупнейших московских сценах с Российским национальным оркестром, Госоркестром России имени Е. Ф. Светланова, Большим симфоническим оркестром имени П. И. Чайковского и Российским национальным молодежным симфоническим оркестром. Регулярно гастролирует по России, сотрудничая, в частности, с Государственным симфоническим оркестром Республики Татарстан, Пермским театром оперы и балета, Новосибирской филармонией и Новосибирским театром оперы и балета (НОВАТ). Выступал на концертах с Аидой Гарифуллиной и Денисом Мацуевым.

    В сезоне 2026/2027 годов Клеман Нонсьё дебютирует с Академическим симфоническим оркестром Санкт-Петербургской филармонии. Среди других предстоящих проектов — концерт с Аидой Гарифуллиной на фестивале имени Дмитрия Хворостовского в Красноярске, опера «Кармен» Жоржа Бизе в Новосибирском театре оперы и балета (НОВАТ), а также концерт французской музыки с Госоркестром России имени Е. Ф. Светланова в Московской филармонии.
    
    >  «Тур и его Луара, Фрайбург и его Шварцвальд, великие столицы: Берлин, потом Москва… То зефир, то циклон, я с нетерпением жду, куда дальше поведет меня этот западный ветер и надеюсь взять вас с собой на будущую встречу! »   
    
# GERMAN
- tag: de
  language: Deutsch
  abbreviation: DE
  content: |-
    > Clément Nonciaux verfügt über ein angeborenes Talent, Vernunft und Emotionen nahtlos zu verbinden. Das ist sein Markenzeichen.
    >
    > -- <cite>ClassicalMusicNews.ru</cite>

    Als Preisträger des ersten Internationalen Rachmaninoff-Wettbewerbs in Moskau 2022 hat sich der französische Dirigent Clément Nonciaux rasch auf der internationalen Bühne etabliert. Diese prestigeträchtige Auszeichnung öffnete ihm unmittelbar die Türen zum Mariinsky-Theater in St. Petersburg.

    Seit seinem Erfolg beim Rachmaninoff-Wettbewerb dirigiert Clément Nonciaux regelmäßig die führenden Orchester Russlands. In Moskau wird er regelmäßig eingeladen, das Russische Nationalorchester, das Svetlanov Symphony Orchestra und das Tchaikovsky Symphony.  
    Er begleitet die Sopranistin Aida Garifullina auf Tourneen und wird vom Pianisten Denis Matsuev und dem Geiger Vadim Repin eingeladen, bei ihren Festivals zu dirigieren. Seine Engagements führten ihn durch ganz Russland, unter anderem nach Tatarstan (Kasan), Sibirien (Nowosibirsk) und in den Ural (Perm).  
    Er beschreibt sich vor allem als Operndirigent und hat bereits die bedeutendsten Werke des französischen Repertoires geleitet.

    In der Saison 2024/2025 dirigiert er am Novaya Opera Theater in Moskau Benjamin Brittens War Requiem und Charles Gounods Romeo und Julia. Außerdem leitet er eine Meisterklasse für die jungen Sänger des renommierten Bolschoi-Theaters, was seine Anerkennung in der russischen Opernwelt unterstreicht.

    Neben seinen Verpflichtungen in Russland verfolgt Clément Nonciaux eine aktive Karriere in Europa. In Frankreich arbeitet er mit dem Orchestre de la Région Centre-Val de Loire und dem Orchestre de Picardie zusammen. In Deutschland ist er als Assistent namhafter Dirigenten wie Steven Sloane und Karl-Heinz Steffens tätig.

    Clément Nonciaux widmet sich der Musik mit dem Ziel, Verbindungen auf der ganzen Welt zu schaffen. Er spricht fließend fünf Sprachen und engagiert sich leidenschaftlich für die Erforschung fremder Kulturen, um eine tiefere Verbindung zu seinem Publikum herzustellen.  
    Emotion und Authentizität sind seine Leitprinzipien: Sein expressiver und theatralischer Dirigierstil verleiht der Aufführung Leben, Tiefe und Aufrichtigkeit

    Geboren in Tours, Frankreich, absolvierte Clément Nonciaux seinen Master in Orchesterdirigieren an der Universität der Künste Berlin (bei Steven Sloane und Harry Curtis) und seinen Bachelor an der Musikhochschule Freiburg im Breisgau (bei Scott Sandmeier).

# ITALIAN
- tag: it
  language: Italiano
  abbreviation: IT
  content: |-
    > Clément Nonciaux ha un talento innato per combinare armoniosamente ragione ed emozione. È il suo marchio distintivo.
    >
    > -- <cite>ClassicalMusicNews.ru</cite>

    Clément Nonciaux è un direttore d'orchestra francese che ha conseguito la laurea magistrale in direzione d'orchestra presso l’Universität der Künste di Berlino. Dopo aver ricevuto numerosi premi presso i conservatori regionali di Parigi e Tours, la sua passione per l'opera lo ha spinto a continuare il suo percorso all'estero, dove ha iniziato i suoi studi di direzione d'orchestra presso la Hochschule für Musik di Friburgo in Brisgovia, Germania (laurea di primo livello).

    Vincitore del secondo premio del primo *Concorso internazionale per pianisti, direttori d'orchestra e compositori Rachmaninoff* a Mosca, è stato immediatamente invitato a esibirsi in concerto al teatro Mariinsky di San Pietroburgo, al teatro Novaya Opera di Mosca e con l'acclamata Orchestra sinfonica nazionale giovanile russa.

    Clément Nonciaux ha diretto orchestre di grande prestigio come la *London Symphony Orchestra*, l'*Orchestra Mariinsky*, l'*Orchestra della Komische Oper Berlin*, l'*Orchestra sinfonica Tchaikovsky*, l'*Orchestra nazionale giovanile russa*, l'*Orchestra filarmonica di Stoccarda*, l'*Orchestra sinfonica della Cappella dello Stato russo*, la *Brandenburgisches Staatsorchester*, la *Kammerakademie Potsdam*, l'*Orchestra filarmonica e teatrale nazionale di Cottbus*, la *Neubrandenburger Philharmonie*, la *Magdeburgische Philharmonie*, l'*Orchestra filarmonica di Atene* e l'*Orchestra filarmonica di stato Banatul di Timisoara*.

    I suoi principali insegnanti sono stati Steven Sloane, Harry Curtis, Scott Sandmeier e Dylan Corlay. Nel corso del suo percorso ha potuto ricevere consigli da direttori d'orchestra internazionali tra cui Valery Gergiev, Martyn Brabbins, Vladimir Fedosseïev, Attilio Cremonesi, Alexander Sladkovsky, Claude Schnitzler, George Pehlivanian, Bruno Weil.

    Clément Nonciaux si dedica alla musica con l'obiettivo di creare legami in tutto il mondo e considera particolarmente importante conoscere le lingue dei paesi in cui lavora. Parla cinque lingue, si interessa alla conoscenza delle culture straniere che la musica gli permette di avvicinare e si impegna emotivamente per raggiungere il pubblico anche con il repertorio del suo paese natale.

# CHINESE
- tag: cn
  language: 中文
  abbreviation: 中文
  content: |-
    「 柯諾修的獨特之處在於，他擁有一種天賦將理性與感性和諧地相容。」
    >
    > -- <cite>ClassicalMusicNews.ru</cite>

    來自法國指揮家柯諾修(Clément Nonciaux)曾獲2022年俄羅斯拉赫瑪尼諾夫國際指揮大賽銀獎，隨即受邀在聖彼得堡Mariinsky劇院舉辦音樂會。

    自2023/2024樂季起，柯諾修受邀以客席指揮身份與俄羅斯國家交響樂團、斯維特拉諾夫交響樂團、柴可夫斯基交響樂團和俄羅斯青年交響樂團等眾多知名樂團合作，展開一系列的驚豔初登場。緊接著，他游歷於俄羅斯不同地區，與韃靼斯坦愛樂、新西伯利亞愛樂、新西伯利亞劇院交響樂團、克拉斯諾亞爾斯克交響樂團和秋明交響樂團等西伯利亞地區知名的樂團合作。他也與著名鋼琴家馬祖耶夫以及女高音阿伊達.嘉里芙琳娜(Aida Garifullina)等著名音樂家一同巡迴演出。接下來，他還將受邀於其他重要音樂節演出，如橫貫西伯利亞藝術節、霍沃羅斯托夫斯基音樂節與拉赫瑪尼諾夫音樂節。除此之外，他也受邀於莫斯科新歌劇院指揮比才的《卡門》與Adolphe Adam的《隆若穆的郵差》兩場歌劇。

    歐洲方面，柯諾修擁有柏林藝術大學的指揮碩士學位和弗萊堡音樂學院的學士學位，在就學期間，即受著名指揮家Steven Sloane邀請與布蘭登堡國家交響樂團Brandenburgisches Staatorchester Frankfurt合作。2024年起，他也將在法國開啟他的職業生涯，將在這個樂季首次與法國羅亞爾河管弦樂團和皮卡第管弦樂團合作。

    柯諾修以其驚人的五項（英、法、德、義、俄）語言能力，積極地探索世界各地文化，他期望透過音樂，與世界各地的觀眾建立更緊密的聯繫。真摯與感性是他的座右銘，透過極具表現力和戲劇張力的指揮風格使音樂從他的手中真誠地流露。

    「圖爾和它的羅亞爾河，弗萊堡和它的黑森林，大都會柏林，然后是莫斯科…時而是和風，時而是旋風，我迫不及待地引頸期盼西風在未來將把我帶到哪個未知，並期望在下一個相遇中能夠與您一同共程！」
